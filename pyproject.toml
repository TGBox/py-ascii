[project]
name = "py-ascii"
version = "1.0.1"
description = "A python GUI app to generate ASCII art from media inputs."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyside6",
]

[project.scripts]
py-ascii = "src.main:main"
main = "src.main:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
